<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b8566a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diário Escolar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Diário Escolar</title>
<style>
:root{
  --bg:#fbf4ea;--surface:#fffaf2;--text:#3a2416;--muted:#8a7362;--border:#ecdfce;
  --primary:#b8566a;--primary-2:#cc7a8c;--primary-soft:#f6e3e6;--gold:#c98a2e;--gold-soft:#fbefd9;
  --ok:#3f8f5a;--ok-soft:#e2f1e6;--danger:#b23b3b;--radius:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#241811;--surface:#2f2117;--text:#f3e6d8;--muted:#b8a08d;--border:#3c2c1f;--primary:#d97a90;--primary-2:#b8566a;--primary-soft:#4a2a31;--gold:#e0a355;--gold-soft:#3d2f19;--ok:#6fc28a;--ok-soft:#1f3326;--danger:#d9584f;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#241811;--surface:#2f2117;--text:#f3e6d8;--muted:#b8a08d;--border:#3c2c1f;--primary:#d97a90;--primary-2:#b8566a;--primary-soft:#4a2a31;--gold:#e0a355;--gold-soft:#3d2f19;--ok:#6fc28a;--ok-soft:#1f3326;--danger:#d9584f;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.top .icon-btn{background:rgba(255,255,255,.2);border:none;color:#fff;min-width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;font-family:inherit}
.top h1{font-size:18px;margin:0;font-weight:800;flex:1;line-height:1.2;min-width:0}
.top .sub{font-size:12.5px;opacity:.9;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#fffaf2;box-shadow:0 0 0 2px rgba(255,255,255,.6);flex-shrink:0}
main{max-width:560px;margin:0 auto;padding:16px 14px calc(100px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);cursor:pointer}
.card h3{margin:0 0 2px;font-size:16px;font-weight:700}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.row>div{flex:1;min-width:0}
.chev{color:var(--muted);font-size:22px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
textarea{min-height:110px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin:12px 0 5px;font-weight:600}
.btn{background:var(--primary);color:#fff;border:none;padding:13px 16px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
.btn.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px}
.btn.danger{background:var(--danger)}
.btn.link{background:none;color:var(--danger);border:none;text-decoration:underline;font-weight:600}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--primary);color:#fff;width:58px;height:58px;border-radius:50%;border:none;font-size:28px;box-shadow:0 6px 16px rgba(184,86,106,.4);cursor:pointer;z-index:6}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14.5px;line-height:1.5}
.empty .big{font-size:42px;display:block;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.ph{margin:0 0 4px;font-size:15px;font-weight:800}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--border);cursor:zoom-in}
.thumb-wrap{position:relative}
.thumb-wrap .rm{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1;cursor:pointer}
.reg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.reg .date{font-weight:800;font-size:13.5px;color:var(--primary)}
.reg p{margin:6px 0;font-size:14.5px;white-space:pre-wrap;line-height:1.45}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions .btn{width:auto;flex:1}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-pend{background:var(--gold-soft);color:var(--gold)}
.avatar,.avatar-lg{border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#5a3a2a}
.avatar{width:44px;height:44px;font-size:18px}
.avatar-lg{width:72px;height:72px;font-size:26px}
.chip{display:inline-block;padding:8px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);font-size:13.5px;margin:0 6px 7px 0;cursor:pointer;color:var(--text);font-family:inherit;font-weight:600;user-select:none}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip.campo.on{background:var(--gold);border-color:var(--gold)}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:10px 0 6px}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:14px;background:var(--primary-soft);color:var(--primary);margin:2px 4px 2px 0;font-weight:700}
.tag.campo{background:var(--gold-soft);color:var(--gold)}
.banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--text);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;cursor:pointer;line-height:1.4}
.alerta{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px;white-space:pre-wrap}
.prog{height:7px;background:var(--border);border-radius:6px;overflow:hidden;margin:10px 0 5px}
.prog div{height:100%;background:var(--ok);border-radius:6px}
.check-list label{display:flex;align-items:center;gap:12px;padding:9px 0;margin:0;color:var(--text);font-size:15px;border-bottom:1px solid var(--border);font-weight:600}
.check-list label:last-child{border-bottom:none}
.check-list input{width:22px;height:22px;flex:none;accent-color:var(--primary)}
.contato a{color:var(--primary);font-weight:700;text-decoration:none;margin-right:14px;font-size:14px}
.filebtn{display:inline-block;background:var(--primary-soft);color:var(--primary);padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin:0}
.filebtn input{display:none}
.btn.recording{background:var(--danger)!important;color:#fff!important;border-color:var(--danger)!important;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.lightbox img{max-width:94vw;max-height:88vh;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3a2416;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#printArea{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
/* ===================== BANCO DE DADOS ===================== */
const DB_NAME='diario_ei_db',DB_VER=2;let db;
function idb(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(e.oldVersion<1){
      d.createObjectStore('turmas',{keyPath:'id',autoIncrement:true});
      const a=d.createObjectStore('alunos',{keyPath:'id',autoIncrement:true});a.createIndex('turmaId','turmaId');
      const g=d.createObjectStore('registros',{keyPath:'id',autoIncrement:true});g.createIndex('alunoId','alunoId');
    }
    if(e.oldVersion<2){
      // índice por data: permite saber quem já tem registro hoje sem carregar todas as fotos
      e.target.transaction.objectStore('registros').createIndex('data','data');
    }
  };
  r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(r.error);
});}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store);}
function reqP(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
const add=(s,o)=>reqP(tx(s,'readwrite').add(o));
const put=(s,o)=>reqP(tx(s,'readwrite').put(o));
const getAll=s=>reqP(tx(s).getAll());
const getByIndex=(s,i,v)=>reqP(tx(s).index(i).getAll(v));
const get=(s,id)=>reqP(tx(s).get(id));
const del=(s,id)=>reqP(tx(s,'readwrite').delete(id));
const clearStore=s=>reqP(tx(s,'readwrite').clear());

/* ===================== CONFIGURAÇÃO ===================== */
const GRUPOS=[
  {g:'Alimentação',unico:true,itens:['Comeu bem','Comeu pouco','Não quis comer']},
  {g:'Sono',unico:true,itens:['Dormiu bem','Dormiu pouco','Não dormiu']},
  {g:'Humor',itens:['Alegre','Tranquilo(a)','Agitado(a)','Choroso(a)','Sonolento(a)']},
  {g:'Higiene',itens:['Evacuou','Trocou fralda','Usou o banheiro']},
  {g:'Interação',itens:['Brincou com os colegas','Participou das atividades','Preferiu brincar sozinho(a)']}
];
const CAMPOS=['O eu, o outro e o nós','Corpo, gestos e movimentos','Traços, sons, cores e formas','Escuta, fala, pensamento e imaginação','Espaços, tempos, quantidades, relações e transformações'];

let state={view:'turmas',turmaId:null,alunoId:null,addOpen:false,regMode:'single',editRegId:null,form:null,filtroDe:null,filtroAte:null,novaFoto:null,editFoto:null};
const app=document.getElementById('app');

/* ===================== UTILITÁRIOS ===================== */
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(iso){if(!iso)return '';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;}
// data LOCAL (a versão anterior usava UTC e, depois das 21h no Brasil, já marcava o dia seguinte)
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function diaSemana(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long'});}
const porNome=(a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR');
function idade(nasc){
  if(!nasc)return '';const [y,m,d]=nasc.split('-').map(Number);const t=new Date();
  let meses=(t.getFullYear()-y)*12+(t.getMonth()+1-m);if(t.getDate()<d)meses--;if(meses<0)return '';
  const a=Math.floor(meses/12),r=meses%12;
  if(a===0)return `${r} ${r===1?'mês':'meses'}`;
  return `${a} ${a===1?'ano':'anos'}${r?` e ${r} ${r===1?'mês':'meses'}`:''}`;
}
function cor(n){let h=0;for(const c of n||'')h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 50% 86%)`;}
function avatar(a,cls='avatar'){
  if(a.foto)return `<img src="${a.foto}" class="${cls}" alt="">`;
  return `<div class="${cls}" style="background:${cor(a.nome)}">${esc(((a.nome||'?').trim()[0]||'?').toUpperCase())}</div>`;
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600);}
function diasDesdeBackup(){try{const v=localStorage.getItem('ultimoBackup');return v?Math.floor((Date.now()-Number(v))/864e5):null;}catch(e){return null;}}
function soDigitos(s){return String(s||'').replace(/\D/g,'');}
function waLink(tel){let d=soDigitos(tel);if(d.length===10||d.length===11)d='55'+d;return d.length>=12?`https://wa.me/${d}`:'';}
function setPrev(id,src){const b=document.getElementById(id);if(b)b.innerHTML=src?`<img src="${src}" class="avatar-lg">`:'';}
/* Data digitada DD/MM/AAAA (sem depender do calendário do celular) */
function mascaraData(v){const d=soDigitos(v).slice(0,8);return d.length>4?`${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}`:d.length>2?`${d.slice(0,2)}/${d.slice(2)}`:d;}
function brParaIso(s){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||'').trim());if(!m)return null;
  const [_,d,mo,y]=m.map(Number),dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  const iso=`${m[3]}-${m[2]}-${m[1]}`;
  if(iso>today()||y<1990)return null;
  return iso;
}
// devolve a data ISO, null se vazio, ou false se inválida (já avisa a professora)
function lerNascimento(id){
  const v=document.getElementById(id).value.trim();if(!v)return null;
  const iso=brParaIso(v);
  if(!iso){toast('Data de nascimento inválida. Digite no formato DD/MM/AAAA.');document.getElementById(id).focus();return false;}
  return iso;
}
document.addEventListener('input',e=>{
  if(!e.target.classList||!e.target.classList.contains('dataMask'))return;
  const el=e.target,novo=mascaraData(el.value);
  if(el.value!==novo){el.value=novo;el.setSelectionRange(novo.length,novo.length);}
});
function abrirZoom(src){const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img src="${src}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);}

function resizeImg(file,maxW=1000){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(fr.error);
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('imagem inválida'));
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.72));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ===================== NAVEGAÇÃO (botão voltar do Android) ===================== */
function depth(v){return {turmas:0,alunos:1,backup:1,editarTurma:2,perfil:2,editarAluno:3,registro:state.regMode==='coletivo'?2:3}[v]??0;}
function parent(v){return {alunos:'turmas',backup:'turmas',editarTurma:'alunos',perfil:'alunos',editarAluno:'perfil',registro:state.regMode==='coletivo'?'alunos':'perfil'}[v]||'turmas';}
let skipPop=false;
function syncHist(d0){
  const d1=depth(state.view);
  if(d1>d0){for(let i=d0;i<d1;i++)history.pushState({d:i+1},'');}
  else if(d1<d0){skipPop=true;history.go(d1-d0);}
}
window.addEventListener('popstate',()=>{
  if(skipPop){skipPop=false;return;}
  if(state.view==='turmas')return;
  state.view=parent(state.view);state.addOpen=false;render();
});

/* ===================== TELAS ===================== */
async function render(){
  if(gravando){querOuvir=false;try{recognition&&recognition.stop();}catch(e){}stopMic();}
  const v=state.view;
  if(v==='turmas')return renderTurmas();
  if(v==='alunos')return renderAlunos();
  if(v==='editarTurma')return renderEditarTurma();
  if(v==='perfil')return renderPerfil();
  if(v==='editarAluno')return renderEditarAluno();
  if(v==='registro')return renderRegistro();
  if(v==='backup')return renderBackup();
}
const btnVoltar=`<button class="icon-btn" data-action="voltar" aria-label="Voltar">‹</button>`;

async function renderTurmas(){
  const turmas=(await getAll('turmas')).sort(porNome);
  const hojeSet=new Set((await getByIndex('registros','data',today())).map(r=>r.alunoId));
  let items='';
  for(const t of turmas){
    const alunos=await getByIndex('alunos','turmaId',t.id);
    const feitos=alunos.filter(a=>hojeSet.has(a.id)).length;
    const pct=alunos.length?Math.round(feitos/alunos.length*100):0;
    items+=`<div class="card" data-action="abrirTurma" data-id="${t.id}">
      <div class="row"><div><h3>${esc(t.nome)}</h3><span class="meta">${t.turno?esc(t.turno)+' · ':''}${alunos.length} aluno(s)</span></div><span class="chev">›</span></div>
      ${alunos.length?`<div class="prog"><div style="width:${pct}%"></div></div><span class="meta">Hoje: ${feitos} de ${alunos.length} registrados</span>`:''}
    </div>`;
  }
  const dias=diasDesdeBackup();
  const banner=turmas.length&&(dias===null||dias>=7)
    ?`<div class="banner" data-action="abrirBackup">💾 ${dias===null?'Você ainda não fez nenhum backup.':`Seu último backup foi há ${dias} dias.`} <b>Toque aqui</b> para guardar uma cópia dos registros.</div>`:'';
  const dataHoje=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  app.innerHTML=`
    <div class="top"><img src="icon-192.png" class="top-logo" alt="" onerror="this.style.display='none'">
      <h1>Minhas Turmas<span class="sub">${esc(dataHoje)}</span></h1>
      <button class="icon-btn" data-action="abrirBackup" aria-label="Backup">💾</button></div>
    <main>
      ${banner}
      ${state.addOpen?formTurma():''}
      ${items||(!state.addOpen?'<div class="empty"><span class="big">🏫</span>Nenhuma turma cadastrada ainda.<br>Toque em <b>+</b> para criar a primeira.</div>':'')}
      ${turmas.length?`<div class="panel"><h3 class="ph">📄 Relatório geral</h3><span class="meta">Todos os alunos de todas as turmas</span>
        <div class="actions"><button class="btn sm" data-action="exportar" data-escopo="tudo" data-fmt="pdf">Imprimir / PDF</button><button class="btn ghost sm" data-action="exportar" data-escopo="tudo" data-fmt="doc">Word (.doc)</button></div></div>`:''}
    </main>
    <button class="fab" data-action="${state.addOpen?'fecharAdd':'abrirAddTurma'}" aria-label="Adicionar">${state.addOpen?'×':'+'}</button>`;
}
function formTurma(){
  return `<div class="panel"><h3 class="ph">Nova turma</h3>
    <label>Nome da turma</label><input id="fNome" placeholder="Ex: Jardim II">
    <label>Turno (opcional)</label><input id="fTurno" placeholder="Ex: Manhã">
    <button class="btn" style="margin-top:14px" data-action="salvarTurma">Salvar turma</button></div>`;
}

function painelRelatorio(escopo){
  return `<div class="panel"><h3 class="ph">📄 Relatório da turma</h3>
    <div class="row"><div><label>De</label><input type="date" id="rDe"></div><div><label>Até</label><input type="date" id="rAte"></div></div>
    <div class="actions"><button class="btn sm" data-action="exportar" data-escopo="${escopo}" data-fmt="pdf">Imprimir / PDF</button><button class="btn ghost sm" data-action="exportar" data-escopo="${escopo}" data-fmt="doc">Word (.doc)</button></div></div>`;
}

async function renderAlunos(){
  const turma=await get('turmas',state.turmaId);
  if(!turma){state.view='turmas';return render();}
  const alunos=(await getByIndex('alunos','turmaId',state.turmaId)).sort(porNome);
  const hojeSet=new Set((await getByIndex('registros','data',today())).map(r=>r.alunoId));
  const feitos=alunos.filter(a=>hojeSet.has(a.id)).length;
  const items=alunos.map(a=>`<div class="card row" data-action="abrirAluno" data-id="${a.id}" data-nome="${esc((a.nome||'').toLowerCase())}">

/* ----- Ditado por voz ----- */
/* O Chrome do Android repete o texto no modo "contínuo" (cada resultado já traz
   tudo o que foi dito antes). Por isso ouvimos UMA frase por vez e reiniciamos
   sozinhos até a professora tocar em Parar — cada frase entra uma única vez. */
let recognition=null,gravando=false,querOuvir=false,micBase='',micAlvo=null;
const ERROS_MIC={'not-allowed':'Permissão de microfone negada. Toque no cadeado ao lado do endereço e permita o microfone.','audio-capture':'Nenhum microfone encontrado.','network':'Sem internet: o ditado do app precisa estar online. Use o microfone do teclado.','service-not-allowed':'O navegador bloqueou o reconhecimento de voz. Use o microfone do teclado.'};
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('O ditado do app não funciona neste navegador.\n\nDica: use o microfone do próprio teclado do celular (ícone 🎤 no teclado) — funciona em qualquer aparelho, até sem internet.');return;}
  if(!window.isSecureContext){alert('O ditado só funciona pelo link https:// do app (GitHub Pages), não abrindo o arquivo direto.');return;}
  if(gravando){querOuvir=false;try{recognition&&recognition.stop();}catch(e){}stopMic();return;}
  micAlvo=document.getElementById('fTexto');
  querOuvir=true;gravando=true;
  const btn=document.getElementById('btnMic');btn.textContent='⏹ Parar';btn.classList.add('recording');
  ouvirFrase(SR);
}
function ouvirFrase(SR){
  const ta=micAlvo;
  if(!querOuvir||!ta||!document.body.contains(ta)){stopMic();return;}
  // parte do que já está escrito (inclusive o que a professora digitou/corrigiu)
  micBase=ta.value.trim()?ta.value.trim()+' ':'';
  const r=new SR();recognition=r;
  r.lang='pt-BR';r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
  let ultimo='';
  r.onresult=e=>{
    const res=e.results[e.results.length-1];
    ultimo=res[0].transcript.trim();
    ta.value=micBase+ultimo;
    if(res.isFinal){micBase=ta.value.trim()+' ';ultimo='';}
  };
  r.onerror=e=>{
    const msg=ERROS_MIC[e.error];
    if(msg){querOuvir=false;stopMic();alert(msg);} // 'no-speech' e 'aborted': só reinicia em silêncio
  };
  r.onend=()=>{
    if(ultimo){ta.value=micBase+ultimo;} // frase que ficou sem confirmação final
    if(querOuvir)setTimeout(()=>{try{ouvirFrase(SR);}catch(err){stopMic();}},150);
    else stopMic();
  };
  try{r.start();}catch(err){querOuvir=false;stopMic();alert('Não foi possível acessar o microfone.');}
}
function stopMic(){gravando=false;querOuvir=false;const b=document.getElementById('btnMic');if(b){b.textContent='🎤 Ditar';b.classList.remove('recording');}}

  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();uso=` · ${(e.usage/1048576).toFixed(1)} MB usados`;}}catch(e){}

        <div class="actions">
          <label class="filebtn">Adicionar<input type="file" accept=".json,application/json" id="fImpAdd"></label>
          <label class="filebtn" style="background:var(--gold-soft);color:var(--gold)">Substituir tudo<input type="file" accept=".json,application/json" id="fImpSub"></label>
        </div></div>
    </main>`;
  document.getElementById('fImpAdd').addEventListener('change',e=>importarBackup(e,false));
  document.getElementById('fImpSub').addEventListener('change',e=>importarBackup(e,true));
}
async function entregar(blob,nome){
  const celular=matchMedia('(pointer:coarse)').matches;
  if(celular&&navigator.canShare){
    try{const f=new File([blob],nome,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nome});return true;}}
    catch(e){if(e.name==='AbortError')return false;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true;
}
async function exportarBackup(){
  const data={app:'diario-escolar',versao:2,turmas:await getAll('turmas'),alunos:await getAll('alunos'),registros:await getAll('registros'),exportadoEm:new Date().toISOString()};
  const ok=await entregar(new Blob([JSON.stringify(data)],{type:'application/json'}),`backup_diario_${today()}.json`);
  if(ok){try{localStorage.setItem('ultimoBackup',String(Date.now()));}catch(e){}toast('Backup gerado ✔');}
}
async function importarBackup(e,substituir){
  const file=e.target.files[0];e.target.value='';if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(!Array.isArray(data.turmas)||!Array.isArray(data.alunos)||!Array.isArray(data.registros))throw new Error('formato');
    const msg=substituir?`Isso APAGA tudo o que está neste aparelho e coloca no lugar o backup (${data.alunos.length} alunos, ${data.registros.length} registros). Continuar?`
                        :`Adicionar ${data.alunos.length} alunos e ${data.registros.length} registros aos dados atuais?`;
    if(!confirm(msg))return;
    if(substituir)for(const s of ['registros','alunos','turmas'])await clearStore(s);
    const mapT={},mapA={};
    for(const t of data.turmas){const {id,...rest}=t;mapT[id]=await add('turmas',rest);}
    for(const a of data.alunos){const {id,turmaId,...rest}=a;mapA[id]=await add('alunos',{...rest,turmaId:mapT[turmaId]??turmaId});}
    for(const r of data.registros){const {id,alunoId,...rest}=r;await add('registros',{...rest,alunoId:mapA[alunoId]??alunoId});}
    toast('Backup restaurado ✔');
    state.view='turmas';history.go(-depth('backup'));skipPop=true;render();
  }catch(err){console.error(err);alert('Esse arquivo não parece ser um backup válido do Diário Escolar.');}
}

function secaoAluno(a,regs,turmaNome,pb){
  const info=[idade(a.nascimento),a.responsavel?'Responsável: '+a.responsavel:''].filter(Boolean).join(' · ');
  let h=`<div class="${pb?'pb':''}"><h2>${esc(a.nome)}${turmaNome?' — '+esc(turmaNome):''}</h2>${info?`<p class="info">${esc(info)}</p>`:''}`;
  if(!regs.length)return h+'<p><i>Nenhum registro no período.</i></p></div>';
  const conta=k=>{const c={};regs.forEach(r=>(r[k]||[]).forEach(t=>c[t]=(c[t]||0)+1));return Object.entries(c).sort((x,y)=>y[1]-x[1]).map(([t,n])=>`${esc(t)} (${n})`).join(' · ');};
  const rt=conta('tags'),rc=conta('campos');
  h+=`<div class="res"><b>${regs.length} registro(s) no período.</b>${rt?`<br>${rt}`:''}${rc?`<br><b>Campos de experiência:</b> ${rc}`:''}</div>`;
  for(const r of regs.slice().sort((x,y)=>x.data.localeCompare(y.data))){
    h+=`<div class="d">${fmtDate(r.data)} (${esc(diaSemana(r.data))})</div>`;
    if((r.tags||[]).length)h+=`<p class="tg">${r.tags.map(esc).join(' · ')}</p>`;
    if(r.texto)h+=`<p>${esc(r.texto).replace(/\n/g,'<br>')}</p>`;
    if((r.campos||[]).length)h+=`<p class="tg"><i>${r.campos.map(esc).join(' · ')}</i></p>`;
    if(r.fotos&&r.fotos.length)h+=r.fotos.map(f=>`<img src="${f}">`).join('');
  }
  return h+'</div>';
}
async function montarRelatorio(escopo,de,ate){
  const filtra=rs=>rs.filter(r=>(!de||r.data>=de)&&(!ate||r.data<=ate));
  const periodo=de||ate?`Período: ${de?fmtDate(de):'início'} a ${ate?fmtDate(ate):fmtDate(today())}`:'Todos os registros';
  const secoes=[];let titulo;
  if(escopo==='aluno'){
    const a=await get('alunos',state.alunoId),t=await get('turmas',a.turmaId);
    titulo=`Relatório de Observações — ${a.nome}`;
    secoes.push(secaoAluno(a,filtra(await getByIndex('registros','alunoId',a.id)),t?.nome,false));
  }else{
    const turmas=escopo==='turma'?[await get('turmas',state.turmaId)]:(await getAll('turmas')).sort(porNome);
    titulo=escopo==='turma'?`Relatório da Turma — ${turmas[0].nome}`:'Relatório Geral — Todas as Turmas';
    for(const t of turmas){
      for(const a of (await getByIndex('alunos','turmaId',t.id)).sort(porNome)){
        secoes.push(secaoAluno(a,filtra(await getByIndex('registros','alunoId',a.id)),escopo==='tudo'?t.nome:null,secoes.length>0));
      }
    }
  }
  return {titulo,body:`<h1>${esc(titulo)}</h1><p class="per">${periodo} · gerado em ${fmtDate(today())}</p>${secoes.join('')||'<p>Nenhum aluno.</p>'}`};
}
async function exportar(escopo,fmt){
  let de,ate;
  if(escopo==='aluno'){de=state.filtroDe;ate=state.filtroAte;}
  else{de=document.getElementById('rDe')?.value||null;ate=document.getElementById('rAte')?.value||null;}
  if(de&&ate&&de>ate)return toast('A data inicial está depois da final.');
  toast('Montando relatório...');
  const {titulo,body}=await montarRelatorio(escopo,de,ate);
  const nome=titulo.replace(/[^\p{L}\p{N}]+/gu,'_').replace(/^_|_$/g,'');
  if(fmt==='doc'){
    const html=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${esc(titulo)}</title><style>${relCss('')}</style></head><body>${body}</body></html>`;
    await entregar(new Blob(['\ufeff',html],{type:'application/msword'}),nome+'.doc');
  }else{
    const p=document.getElementById('printArea');
    p.innerHTML=`<style>${relCss('#printArea')}</style>${body}`;
    await Promise.all([...p.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):null));
    const tituloOriginal=document.title;document.title=nome;
    window.print();
    setTimeout(()=>{document.title=tituloOriginal;},1000);
  }
}
window.addEventListener('afterprint',()=>{document.getElementById('printArea').innerHTML='';});

/* ===================== AÇÕES ===================== */
app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const act=t.dataset.action;
  // ações que não redesenham a tela (preservam o que está digitado)
  if(act==='toggleMic'){toggleMic();return;}
  if(act==='zoom'){abrirZoom(t.getAttribute('src'));return;}
  if(act==='chip'){
    if(t.dataset.unico==='1'&&!t.classList.contains('on'))document.querySelectorAll(`.chip[data-g="${CSS.escape(t.dataset.g)}"]`).forEach(c=>c.classList.remove('on'));
    t.classList.toggle('on');return;
  }
  if(act==='selTodos'||act==='selNenhum'){document.querySelectorAll('.selAluno').forEach(c=>c.checked=act==='selTodos');return;}
  if(act==='removerFotoAluno'){state.editFoto='';const a=await get('alunos',state.alunoId);setPrev('prevEdit','');document.getElementById('prevEdit').innerHTML=avatar({nome:a.nome},'avatar-lg');t.remove();return;}
  if(act==='exportar'){try{await exportar(t.dataset.escopo,t.dataset.fmt);}catch(err){console.error(err);toast('Não foi possível gerar o relatório.');}return;}
  if(act==='exportarBackup'){try{await exportarBackup();}catch(err){console.error(err);toast('Não foi possível gerar o backup.');}renderBackup();return;}

  const d0=depth(state.view);
  try{
    if(act==='voltar'){state.view=parent(state.view);state.addOpen=false;}
    else if(act==='abrirTurma'){state.turmaId=+t.dataset.id;state.view='alunos';state.addOpen=false;}
    else if(act==='abrirAddTurma'){state.addOpen=true;}
    else if(act==='fecharAdd'){state.addOpen=false;}
    else if(act==='abrirBackup'){state.view='backup';}
    else if(act==='salvarTurma'){
      const nome=document.getElementById('fNome').value.trim();
      if(!nome)return toast('Digite o nome da turma.');
      await add('turmas',{nome,turno:document.getElementById('fTurno').value.trim()});
      state.addOpen=false;toast('Turma criada ✔');
    }
    else if(act==='editarTurma'){state.view='editarTurma';}
    else if(act==='salvarEdTurma'){
      const tu=await get('turmas',state.turmaId);const nome=document.getElementById('eNome').value.trim();
      if(!nome)return toast('Digite o nome da turma.');
      await put('turmas',{...tu,nome,turno:document.getElementById('eTurno').value.trim()});
      state.view='alunos';toast('Turma atualizada ✔');
    }
    else if(act==='excluirTurma'){
      const tu=await get('turmas',state.turmaId);
      if(!confirm(`Excluir a turma "${tu.nome}" com TODOS os alunos e registros?\n\nDica: faça um backup antes.`))return;
      for(const a of await getByIndex('alunos','turmaId',tu.id)){
        for(const r of await getByIndex('registros','alunoId',a.id))await del('registros',r.id);
        await del('alunos',a.id);
      }
      await del('turmas',tu.id);state.view='turmas';toast('Turma excluída');
    }
    else if(act==='abrirAddAluno'){state.addOpen=true;state.novaFoto=null;}
    else if(act==='salvarAluno'){
      const nome=document.getElementById('fNomeAluno').value.trim();
      if(!nome)return toast('Digite o nome do aluno.');
      const nasc=lerNascimento('fNascAluno');if(nasc===false)return;
      await add('alunos',{nome,turmaId:state.turmaId,nascimento:nasc,foto:state.novaFoto||null});
      state.addOpen=false;state.novaFoto=null;toast(`${nome} cadastrado(a) ✔`);
    }
    else if(act==='abrirAluno'){state.alunoId=+t.dataset.id;state.filtroDe=null;state.filtroAte=null;state.view='perfil';}
    else if(act==='editarAluno'){state.editFoto=null;state.view='editarAluno';}
    else if(act==='salvarEdAluno'){
      const a=await get('alunos',state.alunoId);const nome=document.getElementById('eNomeA').value.trim();
      if(!nome)return toast('Digite o nome do aluno.');
      const nasc=lerNascimento('eNasc');if(nasc===false)return;
      const foto=state.editFoto===null?a.foto:(state.editFoto||null);
      await put('alunos',{...a,nome,foto,nascimento:nasc,
        responsavel:document.getElementById('eResp').value.trim(),telefone:document.getElementById('eTel').value.trim(),obs:document.getElementById('eObs').value.trim()});
      state.editFoto=null;state.view='perfil';toast('Cadastro atualizado ✔');
    }
    else if(act==='excluirAluno'){
      if(!confirm('Excluir este aluno e todos os registros dele?'))return;
      for(const r of await getByIndex('registros','alunoId',state.alunoId))await del('registros',r.id);
      await del('alunos',state.alunoId);state.view='alunos';toast('Aluno excluído');
    }
    else if(act==='aplicarFiltro'){
      state.filtroDe=document.getElementById('fFiltroDe').value||null;state.filtroAte=document.getElementById('fFiltroAte').value||null;
      if(state.filtroDe&&state.filtroAte&&state.filtroDe>state.filtroAte){state.filtroAte=null;toast('A data inicial estava depois da final.');}
    }
    else if(act==='limparFiltro'){state.filtroDe=null;state.filtroAte=null;}
    else if(act==='novoRegistro'){state.regMode='single';state.editRegId=null;state.form=formVazio();state.view='registro';}
    else if(act==='novoColetivo'){state.regMode='coletivo';state.editRegId=null;state.form=formVazio();state.view='registro';}
    else if(act==='editarRegistro'){
      const r=await get('registros',+t.dataset.id);
      state.regMode='single';state.editRegId=r.id;
      state.form={data:r.data,texto:r.texto||'',tags:[...(r.tags||[])],campos:[...(r.campos||[])],fotos:[...(r.fotos||[])],alunos:null};
      state.view='registro';
    }
    else if(act==='duplicarRegistro'){
      const r=await get('registros',+t.dataset.id);
      state.regMode='single';state.editRegId=null;
      state.form={data:today(),texto:r.texto||'',tags:[...(r.tags||[])],campos:[...(r.campos||[])],fotos:[],alunos:null};
      state.view='registro';
    }
    else if(act==='cancelarRegistro'){
      captureForm();const f=state.form;
      const sujo=!state.editRegId&&(f.texto.trim()||f.tags.length||f.fotos.length);
      if(sujo&&!confirm('Sair sem salvar este registro?'))return;
      state.view=parent('registro');
    }
    else if(act==='rmFoto'){captureForm();state.form.fotos.splice(+t.dataset.i,1);}
    else if(act==='salvarRegistro'){
      captureForm();const f=state.form;
      if(!f.texto.trim()&&!f.fotos.length&&!f.tags.length)return toast('Marque um item, escreva uma observação ou adicione uma foto.');
      const base={data:f.data,texto:f.texto.trim(),tags:f.tags,campos:f.campos,fotos:f.fotos};
      if(state.regMode==='coletivo'){
        if(!f.alunos||!f.alunos.length)return toast('Selecione ao menos um aluno.');
        for(const id of f.alunos)await add('registros',{...base,fotos:[...f.fotos],alunoId:id,coletivo:true,criadoEm:Date.now()});
        toast(`Registro salvo para ${f.alunos.length} aluno(s) ✔`);state.view='alunos';
      }else if(state.editRegId){
        const old=await get('registros',state.editRegId);
        await put('registros',{...old,...base,editadoEm:Date.now()}); // mantém a data de criação original
        toast('Registro atualizado ✔');state.view='perfil';
      }else{
        await add('registros',{...base,alunoId:state.alunoId,criadoEm:Date.now()});
        toast('Registro salvo ✔');state.view='perfil';
      }
      state.form=null;state.editRegId=null;
    }
    else if(act==='excluirRegistro'){
      if(!confirm('Excluir este registro?'))return;
      await del('registros',+t.dataset.id);toast('Registro excluído');
    }
  }catch(err){console.error(err);toast('Ocorreu um erro. Tente novamente.');}
  syncHist(d0);
  render();
});

  try{db=await idb();}
